server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  # Scanned PDFs are OCRed synchronously before the backend can create the
  # extraction task. Keep this endpoint open long enough for local Tesseract;
  # the default 60-second proxy timeout cuts off valid, still-running OCR jobs.
  location = /api/v1/source-cvs/upload-and-extract {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $main_backend http://main-backend:8000;
    proxy_pass $main_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }

  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $main_backend http://main-backend:8000;
    proxy_pass $main_backend;
    proxy_connect_timeout 30s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Every deployment can point index.html at a different content-hashed bundle.
  # Force browsers to revalidate the shell so they cannot keep executing an
  # older bundle after the Docker image has been rebuilt.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # Content-hashed assets are safe to retain and reduce repeat-load cost.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
