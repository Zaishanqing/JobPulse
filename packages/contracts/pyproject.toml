[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobgraph-contracts"
version = "0.1.0"
description = "Framework-neutral Jobgraph service contracts"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jobgraph_contracts*"]

[tool.setuptools.package-data]
jobgraph_contracts = ["*.json", "api_docs_assets/*"]
