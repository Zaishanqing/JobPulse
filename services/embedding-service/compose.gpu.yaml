name: jobpulse-embedding-gpu

services:
  embedding-service:
    image: ${EMBEDDING_IMAGE:-jobpulse/embedding-service:gpu-local}
    build:
      context: ../..
      dockerfile: services/embedding-service/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
        PIP_RETRIES: ${PIP_RETRIES:-10}
        TORCH_VARIANT: gpu
    gpus: all
    environment:
      EMBEDDING_MODEL_ID: BAAI/bge-m3
      EMBEDDING_MODEL_REVISION: 5617a9f61b028005a4858fdac845db406aefb181
      EMBEDDING_DIMENSION: 1024
      EMBEDDING_NORMALIZED: "true"
      EMBEDDING_DEVICE: cuda
      EMBEDDING_USE_FP16: "false"
      EMBEDDING_BATCH_SIZE: 16
      EMBEDDING_MAX_CONCURRENCY: 1
      EMBEDDING_REQUEST_TIMEOUT_SECONDS: 60
      EMBEDDING_CACHE_DIR: /models
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      - type: bind
        source: ${EMBEDDING_MODEL_CACHE:?set EMBEDDING_MODEL_CACHE}
        target: /models
    ports:
      - "${EMBEDDING_PUBLISHED_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 30
