services:
  embedding-service:
    build: .
    environment:
      EMBEDDING_MODEL_ID: BAAI/bge-m3
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:?set a pinned Hugging Face commit}
      EMBEDDING_DIMENSION: 1024
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
      EMBEDDING_MAX_CONCURRENCY: ${EMBEDDING_MAX_CONCURRENCY:-2}
      EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-30}
      EMBEDDING_CACHE_DIR: /models
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
    volumes:
      - embedding-models:/models
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  embedding-models:
