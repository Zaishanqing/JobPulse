[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobgraph-embedding-service"
version = "0.1.0"
description = "Pinned BGE-M3 dense embedding HTTP service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "FlagEmbedding>=1.3.5,<2",
  "huggingface-hub>=0.27,<1",
  "numpy>=2,<3",
  "pydantic-settings>=2.7,<3",
  "torch>=2.5,<3",
  "transformers==4.57.6",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
