[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-competency-graph"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "psycopg[binary]>=3.2",
  "sqlalchemy>=2.0", "alembic>=1.13", "PyJWT>=2.9",
  "passlib[bcrypt]>=1.7", "bcrypt>=4,<4.1", "python-multipart>=0.0.9", "PyYAML>=6.0",
  "openai>=1.0", "tenacity>=8.0", "httpx>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "pytest-xdist>=3.6", "httpx>=0.27", "ruff==0.15.21"]

[tool.setuptools.packages.find]
include = ["app*", "jobgraph_contracts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
addopts = "--cov=app --cov-report=term-missing --cov-branch --cov-fail-under=85"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
partial_branches = ["pragma: no branch", "^\\s*def .+\\):"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E401", "E402", "E701", "E702", "F401", "F403", "F405"]
