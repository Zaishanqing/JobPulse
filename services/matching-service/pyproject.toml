[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobgraph-matching-service"
version = "0.14.0"
description = "Observable explainable matching API and graceful task workers"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "PyJWT[crypto]>=2.10",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
  "uvicorn[standard]>=0.30",
  "openai>=1.30",
  "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
responsibility-ce = ["torch>=2.5,<3", "transformers>=4.46,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.."]
addopts = "--cov=app --cov-report=term-missing --cov-branch --cov-fail-under=85"
markers = [
  "container_integration: opt-in Docker Compose integration tests",
  "postgres_integration: opt-in live PostgreSQL integration tests",
  "redis_integration: opt-in live Redis integration tests",
  "embedding_integration: opt-in live HTTP embedding service tests",
  "vector_integration: opt-in live vector service tests",
  "oidc_integration: opt-in live OIDC discovery and JWKS tests",
  "upstream_integration: opt-in live profile, graph and authorization tests",
  "external_e2e: opt-in complete external dependency end-to-end tests",
  "external_offline: opt-in live embedding/vector offline ranking tests",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
