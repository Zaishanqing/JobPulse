[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobgraph-trend-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "beautifulsoup4",
    "fastapi",
    "httpx",
    "pydantic-settings",
    "psycopg[binary]",
    "python-multipart",
    "sqlalchemy",
    "uvicorn",
    "yake",
]

[project.optional-dependencies]
dev = ["httpx", "pytest", "pytest-cov>=5", "PyYAML", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
